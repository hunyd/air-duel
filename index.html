<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Yuji+Syuku&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 레이어: 게임 월드 → 칼 → 뼈대 → UI, 웹캠은 오른쪽 위 미니 창 -->
  <canvas id="world" class="layer"></canvas>
  <canvas id="sword" class="layer"></canvas>
  <canvas id="skeleton" class="layer"></canvas>

  <div id="ui">
    <header id="topbar" data-mode="DUEL">
      <div class="duel-only hp glass" id="hp-you">
        <span class="hp-label">YOU</span>
        <div class="hp-track"><div class="hp-fill" id="hp-you-fill"></div></div>
      </div>
      <div class="center glass" id="center-stat">
        <span id="stat-main">ROUND 1</span>
        <span id="stat-sub">0</span>
      </div>
      <div class="duel-only hp glass right" id="hp-rival">
        <div class="bars">
          <div class="hp-track"><div class="hp-fill" id="hp-rival-fill"></div></div>
          <div class="mo-row"><span>MOMENTUM</span><div class="mo-track"><div class="mo-fill" id="mo-fill"></div></div></div>
        </div>
        <span class="hp-label">RIVAL</span>
      </div>
    </header>

    <div id="cam" class="glass">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="cam-skeleton"></canvas>
    </div>

    <div id="banner"></div>
    <div id="hint"></div>

    <div id="panel" class="glass hidden" role="dialog" aria-modal="true">
      <div id="panel-title"></div>
      <div id="panel-sub"></div>
      <div id="panel-buttons"></div>
    </div>

    <div id="cursor"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="prog" id="cursor-prog" cx="22" cy="22" r="18"/><circle class="dot" cx="22" cy="22" r="4"/></svg></div>
    <div id="palm-charge"><svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="prog" id="palm-prog" cx="40" cy="40" r="34"/></svg></div>

    <nav id="dock" class="glass">
      <div class="item" data-g="GRIP" title="Make a fist">
        <svg viewBox="0 0 24 24"><path d="M7 11V8.5a1.5 1.5 0 0 1 3 0V10M10 10V7.5a1.5 1.5 0 0 1 3 0V10M13 10V8a1.5 1.5 0 0 1 3 0v2.5M16 10.5a1.5 1.5 0 0 1 3 0V13a6.5 6.5 0 0 1-6.5 6.5h-1A6.5 6.5 0 0 1 5 13v-1.5a1.5 1.5 0 0 1 3 0V13"/></svg>
        <span>GRIP</span>
      </div>
      <div class="item" data-g="SLASH" title="Swing fast">
        <svg viewBox="0 0 24 24"><path d="M20 4 9 15"/><path d="M7.5 13.5l3 3"/><path d="M8 16l-3 3"/><path d="M3 11a12 12 0 0 0 10 10"/></svg>
        <span>SLASH</span>
      </div>
      <div class="item" data-g="THRUST" title="Push your fist toward the camera">
        <svg viewBox="0 0 24 24"><circle cx="16" cy="12" r="5"/><circle cx="16" cy="12" r="1.2"/><path d="M2 12h9"/><path d="M8 9l3 3-3 3"/></svg>
        <span>THRUST</span>
      </div>
      <div class="item" data-g="GUARD" title="Hold the blade still">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.6-3 8-7 9.5-4-1.5-7-4.9-7-9.5V6z"/></svg>
        <span>GUARD</span>
      </div>
      <div class="item" data-g="MENU" title="Open palm">
        <svg viewBox="0 0 24 24"><path d="M18 11.5V6.5a1.5 1.5 0 0 0-3 0V11M15 10.5V4.5a1.5 1.5 0 0 0-3 0v6M12 10.5V5.5a1.5 1.5 0 0 0-3 0V12M9 12V8.5a1.5 1.5 0 0 0-3 0V15a6 6 0 0 0 6 6h1a6 6 0 0 0 5.2-3l2.4-4.3a1.5 1.5 0 0 0-2.6-1.5L18 14"/></svg>
        <span>MENU</span>
      </div>
    </nav>

    <div id="status" class="glass">
      <span id="status-dot"></span>
      <span id="status-text">Starting…</span>
      <button id="status-retry" type="button" hidden>Retry</button>
    </div>

    <pre id="debug" class="glass hidden"></pre>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
